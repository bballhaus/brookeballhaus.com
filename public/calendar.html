<script>(()=>{const el=document.querySelector('.doing');if(!el)return;const W=el.dataset.words.split('|');let i=0;
if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
const sleep=t=>new Promise(r=>setTimeout(r,t));
(async()=>{for(;;){await sleep(1600);let w=el.textContent;while(w.length){w=w.slice(0,-1);el.textContent=w;await sleep(35)}i=(i+1)%W.length;const n=W[i];for(let k=1;k<=n.length;k++){el.textContent=n.slice(0,k);await sleep(70)}}})()})()</script>
