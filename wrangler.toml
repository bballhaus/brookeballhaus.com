name = "brookeballhaus"
main = "src/worker.js"
compatibility_date = "2026-11-01"

routes = [
  { pattern = "brookeballhaus.com", custom_domain = true },
  { pattern = "www.brookeballhaus.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"

# "Drop me a note" emails. Requires Email Routing on brookeballhaus.com with
# ballhaus@stanford.edu added and verified as a destination address.
[[send_email]]
name = "NOTES"
destination_address = "ballhaus@stanford.edu"

# Rate limit for /api/note (per visitor IP).
[[ratelimits]]
name = "NOTE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
